<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; Yale Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0B1B33; color:#EDE8E4; font-family:"Inter",system-ui,sans-serif; text-align:center; padding:2rem; }
  .code { font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(3rem,12vw,6rem);
          letter-spacing:-.03em; margin:0; line-height:1; }
  h1 { font-family:"Archivo",sans-serif; font-weight:800; text-transform:uppercase;
       letter-spacing:-.02em; font-size:clamp(1.1rem,3vw,1.5rem); margin:1rem 0 .6rem; }
  p { color:rgba(237,232,228,.68); margin:0 0 2rem; font-size:.95rem; }
  a { display:inline-block; font-family:"Archivo",sans-serif; font-weight:700; font-size:.78rem;
      letter-spacing:.08em; text-transform:uppercase; padding:1rem 2rem;
      background:#fff; color:#0B1B33; border:1.5px solid #fff; text-decoration:none; }
  a:hover { background:transparent; color:#fff; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>We couldn't find that page</h1>
  <p>It may have moved, or the link may be out of date.</p>
  <a id="home" href="/">Back to Yale Landing</a>
</main>
<script>
  // On a project page the site root is /REPO/, not /. Work it out from the URL
  // so this link is right whether the repo is renamed or moved to a domain.
  (function () {
    var seg = location.pathname.split("/").filter(Boolean);
    var host = location.hostname || "";
    var root = host.endsWith("github.io") && seg.length ? "/" + seg[0] + "/" : "/";
    document.getElementById("home").setAttribute("href", root);
  })();
</script>
</body>
</html>
